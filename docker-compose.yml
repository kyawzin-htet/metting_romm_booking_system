services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting-room-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
      POSTGRES_DB: meeting_room_booking
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_room_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
